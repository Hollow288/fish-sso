server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: fish-sso
  datasource:
    url: ${MYSQL_URL:}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}

app:
  sso:
    issuer: ${SSO_ISSUER:http://localhost:9000}
    session-ttl: ${SSO_SESSION_TTL:8h}
    auth-code-ttl: ${SSO_AUTH_CODE_TTL:5m}
    access-token-ttl: ${SSO_ACCESS_TOKEN_TTL:30m}
    id-token-ttl: ${SSO_ID_TOKEN_TTL:30m}
    refresh-token-ttl: ${SSO_REFRESH_TOKEN_TTL:7d}
    cookie:
      secure: ${SSO_COOKIE_SECURE:true}
      same-site: ${SSO_COOKIE_SAME_SITE:Lax}
    allowed-return-to-prefixes:
      - /consent
    jwt:
      key-store-path: ${SSO_JWT_KEY_STORE_PATH:keys/sso-jwt-keys.properties}
      rotation-period: ${SSO_JWT_ROTATION_PERIOD:30d}
      previous-key-retention: ${SSO_JWT_PREVIOUS_KEY_RETENTION:1d}
    login-protection:
      account:
        max-failures: 5
        window: 5m
        block-duration: 10m
      ip:
        max-failures: 40
        window: 10m
        block-duration: 30m
      account-ip:
        max-failures: 8
        window: 10m
        block-duration: 20m

logging:
  level:
    org.springframework.security: INFO
